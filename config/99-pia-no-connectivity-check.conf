# Installed by pia-vpn-setup (install-security-features.sh / update.sh).
#
# NetworkManager's connectivity check binds to the physical interface, so
# it bypasses the VPN and sends a plain HTTP request to Canonical from the
# real IP every few minutes. With the kill switch on, those requests are
# (correctly) dropped, and NetworkManager then reports "limited"
# connectivity, which makes some apps think they're offline. Disabling the
# check fixes both; the only loss is captive-portal (hotel Wi-Fi) detection.
[connectivity]
enabled=false
